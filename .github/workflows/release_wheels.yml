name: Release Wheels

# Builds the Python package (distribution `hydrocouple.meshkit`, imported as
# `meshkit`) for every supported platform and publishes it to PyPI when a
# version tag is pushed. A manual run builds and uploads the artifacts without
# publishing.
#
# Publishing uses PyPI trusted publishing: the PyPI project
# `hydrocouple.meshkit` must list this repository, this workflow file and the
# `pypi` environment as a trusted publisher. No API token is stored.
#
# A tag vX.Y.Z must name the version the sources declare (CMakeLists.txt and
# setup.py); the version job refuses anything else, so a MeshKit tag always
# means one version for the wheels and for the CMake consumers that fetch it.

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Tag matches version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compare the tag with CMakeLists.txt and setup.py
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python -m pip install --quiet packaging
          python - <<'EOF'
          import os, pathlib, re, sys
          from packaging.version import Version
          tag = Version(os.environ["TAG"].removeprefix("v"))
          cmake = re.search(r"project\(MeshKit VERSION (\d+\.\d+\.\d+)",
                            pathlib.Path("CMakeLists.txt").read_text()).group(1)
          python = re.search(r'version="([^"]+)"', pathlib.Path("setup.py").read_text()).group(1)
          problems = []
          if Version(cmake).release != tag.release:
              problems.append(f"CMakeLists.txt declares {cmake}")
          if Version(python) != tag:
              problems.append(f"setup.py declares {python}")
          if problems:
              sys.exit(f"tag {os.environ['TAG']} does not match the sources: " + "; ".join(problems))
          print(f"tag {os.environ['TAG']} matches CMakeLists.txt {cmake} and setup.py {python}")
          EOF

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: [ version ]
    strategy:
      fail-fast: false
      matrix:
        # Native runners for each architecture; macOS builds x86_64 and arm64
        # (see [tool.cibuildwheel] in pyproject.toml).
        os: [ ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v3.3.1
        with:
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    needs: [ version ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist
        # MANIFEST.in carries the C++ sources and CMake files the wheel build needs.
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist . --outdir dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [ wheels, sdist ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hydrocouple.meshkit
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
